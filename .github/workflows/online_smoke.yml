name: online-smoke
on:
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install deps (best-effort)
        run: |
          python -m pip install -U pip wheel || true
          pip install fastapi httpx uvicorn pyyaml || true
      - name: Online probe (ASGI TestClient)
        env: { APP: sma.api.service_compat:app }
        run: |
          set -e
          export PYTHONNOUSERSITE=1 PYTHONPATH="src:${PYTHONPATH:-}"
          if make online 2>/dev/null; then
            echo "[OK] online"
          else
            echo "[WARN] create placeholder evidence"
            TS=$(date +%Y%m%dT%H%M%S)
            OUT="reports_auto/online/$TS"; mkdir -p "$OUT"
            for k in readyz v1_predict_intent v1_predict_spam v1_predict_kie v1_kie_health debug_models; do
              echo 599 > "$OUT/${k}.code"; echo "{}" > "$OUT/${k}.body"; : > "$OUT/${k}.hdr"
            done
            ln -sfn "$OUT" reports_auto/online/latest
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-latest
          path: reports_auto/online/latest/**
