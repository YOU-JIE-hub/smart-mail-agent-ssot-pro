name: api-smoke
on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install "uvicorn[standard]" fastapi
      - name: Start shim & smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          uvicorn sma.api.shim_app:app --host 127.0.0.1 --port 8000 --log-level warning >/tmp/uv.out 2>/tmp/uv.err &
          API_PID=$!
          for i in $(seq 1 25); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/readyz || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          fail=0
          for ep in health healthz ready readyz; do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/$ep || true)"
            echo "$ep -> $code"
            [ "$code" = "200" ] || fail=1
          done
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"text":"Win a FREE prize!!!"}' http://127.0.0.1:8000/v1/predict/spam || true)"
          echo "spam -> $code"; [ "$code" = "200" ] || fail=1
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"text":"請問退款流程？"}' http://127.0.0.1:8000/v1/predict/intent || true)"
          echo "intent -> $code"; [ "$code" = "200" ] || fail=1
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"text":"金額 12,500；0912-345-678；a@b.com"}' http://127.0.0.1:8000/v1/predict/kie || true)"
          echo "kie -> $code"; [ "$code" = "200" ] || fail=1
          kill "$API_PID" 2>/dev/null || true
          exit $fail
      - name: Upload uvicorn logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-logs
          path: /tmp/uv.*
          if-no-files-found: ignore
