name: pro-eval
on:
  workflow_dispatch: {}
  pull_request:
    branches: [ main ]
jobs:
  pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install deps (best-effort)
        run: |
          python -m pip install -U pip wheel || true
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          else
            pip install fastapi httpx uvicorn pyyaml joblib scikit-learn jq || true
          fi
      - name: Pro eval & model card
        run: |
          set -e
          export PYTHONNOUSERSITE=1 PYTHONPATH="src:${PYTHONPATH:-}"
          if make pro-all 2>/dev/null; then
            echo "[OK] pro-all"
          else
            echo "[WARN] no artifacts, create placeholder"
            mkdir -p reports_auto/pro/latest
            echo '{"note":"pro-all skipped in CI"}' > reports_auto/pro/latest/summary.json
            echo '# Pro Eval (placeholder)' > reports_auto/pro/latest/summary.md
          fi
          make model-card || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pro-latest
          path: |
            reports_auto/pro/latest/**
            MODEL_CARD.md
