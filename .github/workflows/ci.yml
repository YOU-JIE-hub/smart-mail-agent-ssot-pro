name: ci
on:
  push: { branches: ["**"] }
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-ci.txt
      - name: Lint / Type / Test
        run: |
          make lint
          make type
          make test
      - name: Eval (optional)
        run: |
          make -s pro-robust-ab-url || true
          make -s pro-robust-gate || true
      - name: Upload reports (if any)
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('reports_auto/pro/latest/*') != '' }}
        with:
          name: reports_auto
          path: reports_auto/pro/latest
