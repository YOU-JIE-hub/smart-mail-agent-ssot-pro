version: 1
amount:
  patterns:
    - name: amt_ntd
      regex: "(NT\\$|NTD|TWD)\\s?([0-9]{1,3}(?:,[0-9]{3})*(?:\\.[0-9]{1,2})?)"
      currency: TWD
    - name: amt_usd
      regex: "(USD|US\\$)\\s?([0-9]{1,3}(?:,[0-9]{3})*(?:\\.[0-9]{1,2})?)"
      currency: USD
    - name: amt_suffix_km
      regex: "([0-9]+(?:\\.[0-9]+)?)\\s?(k|m)\\s?(TWD|USD|NTD|NT\\$|US\\$)?"
currency_alias:
  TWD: ["TWD","NTD","NT$"]
  USD: ["USD","US$"]
date_time:
  eod: ["EOD","eod","今天下班前","今日結束前"]
  eow: ["EOW","eow","本週結束前","週末前"]
  eom: ["EOM","eom","本月結束前","月底前"]
  dow: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun","一","二","三","四","五","六","日"]
env:
  values: ["sandbox","UAT","prod","production","uat","prd","生產","測試"]
sla:
  patterns:
    - regex: "(99\\.[0-9]{1,2}\\s?%)"
rto:
  patterns:
    - regex: "RTO\\s*[:=]?\\s*([0-9]+)\\s*(m|min|分鐘|h|hr|小時)"
rpo:
  patterns:
    - regex: "RPO\\s*[:=]?\\s*([0-9]+)\\s*(m|min|分鐘|h|hr|小時)"
seats:
  patterns:
    - regex: "([0-9]{1,5})\\s?(seat|seats|席)"
po_grn:
  patterns:
    - regex: "\\b(PO|GRN)\\b"
api_path:
  patterns:
    - regex: "(/v[0-9]+/[A-Za-z0-9_\\-/]+)"
http_status:
  patterns:
    - regex: "\\b(4\\d{2}|5\\d{2})\\b"
rate_limit:
  patterns:
    - regex: "([0-9]{1,6})\\s?(rpm|req/min|requests per minute)"
qps:
  patterns:
    - regex: "([0-9]{1,6})\\s?(qps|req/s|requests per second)"
maus:
  patterns:
    - regex: "([0-9]{1,9})\\s?(MAU|monthly active users)"
stores:
  patterns:
    - regex: "([0-9]{1,5})\\s?(stores|門市)"
warehouses:
  patterns:
    - regex: "([0-9]{1,5})\\s?(warehouses|倉|倉庫)"
